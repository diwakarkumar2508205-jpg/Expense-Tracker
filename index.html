<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1b1e27;
      --panel-border: #2a2e3a;
      --text: #e8e9ed;
      --muted: #8b8f9c;
      --accent: #5eead4;
      --accent-dim: #245c53;
      --danger: #f47174;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 620px;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.6rem;
      margin: 0 0 4px 0;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .summary {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .summary .label {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .summary .total {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--accent);
    }

    form {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    form .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      grid-column: 1 / -1;
      padding: 12px;
      background: var(--accent);
      color: #0a0f0d;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover {
      background: #4fd6c0;
    }

    .list {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
    }

    .list-header {
      padding: 14px 20px;
      font-size: 0.8rem;
      color: var(--muted);
      border-bottom: 1px solid var(--panel-border);
    }

    .expense-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--panel-border);
    }

    .expense-row:last-child {
      border-bottom: none;
    }

    .expense-info .note {
      font-size: 0.95rem;
    }

    .expense-info .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .expense-amount {
      font-weight: 600;
      color: var(--accent);
      margin-right: 14px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .delete-btn {
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--danger);
      width: auto;
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
    }

    .delete-btn:hover {
      background: rgba(244, 113, 116, 0.1);
    }

    .category-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 4px 0;
    }

    .category-row .cat-name {
      color: var(--text);
    }

    .category-row .cat-amount {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Expense Tracker</h1>
      <p>Log what you spend and see where it goes.</p>
    </header>

    <!-- Total spending summary -->
    <div class="summary">
      <div>
        <div class="label">Total spent</div>
        <div class="total" id="totalAmount">$0.00</div>
      </div>
    </div>

    <!-- Add expense form (not functional yet — that's Step 2) -->
    <form id="expenseForm">
      <div>
        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01" placeholder="0.00" required />
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
      </div>
      <div class="full">
        <label for="note">Note</label>
        <input type="text" id="note" placeholder="e.g. Lunch with friends" />
      </div>
      <button type="submit">Add expense</button>
    </form>

    <!-- Category breakdown -->
    <div class="summary" id="categoryBreakdown" style="display: block;">
      <div class="label" style="margin-bottom: 10px;">By category</div>
      <div id="categoryList"></div>
    </div>

    <!-- Expense list -->
    <div class="list">
      <div class="list-header">Recent expenses</div>
      <div id="expenseList">
        <div class="empty-state">No expenses yet. Add your first one above.</div>
      </div>
    </div>
  </div>

  <script>
    // This array holds every expense in memory.
    // Each expense is an object: { id, amount, category, note }
    // We try to load any previously saved expenses from localStorage first,
    // so a page refresh doesn't wipe everything out.
    const STORAGE_KEY = 'expense-tracker-data';

    let expenses = loadExpenses();

    function loadExpenses() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        // If nothing was saved before, saved will be null — default to []
        return saved ? JSON.parse(saved) : [];
      } catch (err) {
        // If the saved data is somehow corrupted, don't crash the app —
        // just start fresh and log the problem for debugging.
        console.error('Could not load saved expenses:', err);
        return [];
      }
    }

    function saveExpenses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }

    // Grab references to the DOM elements we'll need repeatedly
    const form = document.getElementById('expenseForm');
    const amountInput = document.getElementById('amount');
    const categoryInput = document.getElementById('category');
    const noteInput = document.getElementById('note');
    const expenseListEl = document.getElementById('expenseList');
    const totalAmountEl = document.getElementById('totalAmount');
    const categoryListEl = document.getElementById('categoryList');

    // Runs every time the expenses array changes.
    // It rebuilds the list and the total from scratch — simplest way
    // to keep what's on screen in sync with our data.
    function render() {
      // Update total
      const total = expenses.reduce((sum, e) => sum + e.amount, 0);
      totalAmountEl.textContent = '$' + total.toFixed(2);

      // Group expenses by category and sum each group.
      // reduce() builds an object like: { Food: 42.50, Transport: 10 }
      const byCategory = expenses.reduce((acc, e) => {
        acc[e.category] = (acc[e.category] || 0) + e.amount;
        return acc;
      }, {});

      const categoryEntries = Object.entries(byCategory); // [ [category, amount], ... ]

      if (categoryEntries.length === 0) {
        categoryListEl.innerHTML = '<div class="meta">Nothing to break down yet.</div>';
      } else {
        categoryListEl.innerHTML = categoryEntries
          // Sort so the biggest spending category shows first
          .sort((a, b) => b[1] - a[1])
          .map(([cat, amt]) => `
            <div class="category-row">
              <span class="cat-name">${cat}</span>
              <span class="cat-amount">$${amt.toFixed(2)}</span>
            </div>
          `)
          .join('');
      }

      // Empty state
      if (expenses.length === 0) {
        expenseListEl.innerHTML = '<div class="empty-state">No expenses yet. Add your first one above.</div>';
        return;
      }

      // Build one row per expense (newest first)
      expenseListEl.innerHTML = expenses
        .slice()
        .reverse()
        .map(e => `
          <div class="expense-row">
            <div class="expense-info">
              <div class="note">${e.note || e.category}</div>
              <div class="meta">${e.category}</div>
            </div>
            <div style="display:flex; align-items:center;">
              <span class="expense-amount">$${e.amount.toFixed(2)}</span>
              <button class="delete-btn" data-id="${e.id}">Delete</button>
            </div>
          </div>
        `)
        .join('');
    }

    // Event delegation: instead of attaching a click listener to every
    // delete button individually (which is fragile — new buttons keep
    // getting added/removed by render()), we attach ONE listener to the
    // parent list and check which button was actually clicked.
    expenseListEl.addEventListener('click', function (event) {
      if (!event.target.classList.contains('delete-btn')) return;

      const idToDelete = Number(event.target.dataset.id);

      // Keep every expense EXCEPT the one whose id matches
      expenses = expenses.filter(e => e.id !== idToDelete);

      saveExpenses();
      render();
    });

    // Handle form submission
    form.addEventListener('submit', function (event) {
      // Stop the browser from reloading the page (default form behavior)
      event.preventDefault();

      const amount = parseFloat(amountInput.value);
      const category = categoryInput.value;
      const note = noteInput.value.trim();

      // Basic validation — don't add junk data
      if (isNaN(amount) || amount <= 0) {
        alert('Please enter a valid amount.');
        return;
      }

      // Add the new expense to our array.
      // We give it a unique id (Date.now() is "good enough" uniqueness
      // for a small app like this — two clicks never happen at the exact
      // same millisecond) so we can find and delete THIS specific expense
      // later, even if two expenses look identical.
      expenses.push({ id: Date.now(), amount, category, note });

      saveExpenses();


      // Clear the form for the next entry
      form.reset();

      // Re-render the list and total
      render();
    });

    // Initial render on page load
    render();
  </script>
</body>
</html>
